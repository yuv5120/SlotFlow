services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slotflow
      POSTGRES_USER: slotflow
      POSTGRES_PASSWORD: slotflow
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotflow -d slotflow"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://slotflow:slotflow@postgres:5432/slotflow
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "uv run python -m scripts.migrate && uv run python -m scripts.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://slotflow:slotflow@postgres:5432/slotflow
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "python", "-m", "app.worker"]
    depends_on:
      api: { condition: service_healthy }
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  frontend_node_modules:
